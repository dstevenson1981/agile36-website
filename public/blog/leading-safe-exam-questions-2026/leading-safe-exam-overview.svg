<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#1e40af"/>
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">Leading SAFe (SA) Certification Exam</text>
  
  <!-- Main content area -->
  <rect x="40" y="100" width="720" height="360" fill="white" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  
  <!-- Left column - Exam Details -->
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">Exam Specifications</text>
  
  <!-- Duration -->
  <circle cx="80" cy="170" r="20" fill="#3b82f6"/>
  <text x="80" y="177" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">90</text>
  <text x="110" y="177" font-family="Arial, sans-serif" font-size="14" fill="#374151">Minutes Duration</text>
  
  <!-- Questions -->
  <circle cx="80" cy="210" r="20" fill="#10b981"/>
  <text x="80" y="217" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">45</text>
  <text x="110" y="217" font-family="Arial, sans-serif" font-size="14" fill="#374151">Multiple Choice Questions</text>
  
  <!-- Passing Score -->
  <circle cx="80" cy="250" r="20" fill="#f59e0b"/>
  <text x="80" y="257" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">77%</text>
  <text x="110" y="257" font-family="Arial, sans-serif" font-size="14" fill="#374151">Passing Score (35/45 correct)</text>
  
  <!-- Cost -->
  <circle cx="80" cy="290" r="20" fill="#ef4444"/>
  <text x="80" y="297" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">$795</text>
  <text x="110" y="297" font-family="Arial, sans-serif" font-size="14" fill="#374151">Exam Registration Fee</text>
  
  <!-- Right column - 2026 Changes -->
  <text x="420" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">2026 Exam Updates</text>
  
  <!-- Scenario-based questions -->
  <rect x="430" y="160" width="300" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="440" y="177" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">60% Scenario-Based Questions</text>
  <text x="440" y="193" font-family="Arial, sans-serif" font-size="11" fill="#374151">Real-world application over memorization</text>
  
  <!-- Metrics focus -->
  <rect x="430" y="210" width="300" height="40" fill="#d1fae5" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="440" y="227" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#065f46">Enhanced Metrics Focus</text>
  <text x="440" y="243" font-family="Arial, sans-serif" font-size="11" fill="#374151">Flow metrics and value measurement</text>
  
  <!-- Cross-role integration -->
  <rect x="430" y="260" width="300" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="4"/>
  <text x="440" y="277" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">Cross-Role Integration</text>
  <text x="440" y="293" font-family="Arial, sans-serif" font-size="11" fill="#374151">RTE, PO, and SM collaboration scenarios</text>
  
  <!-- Bottom section - Success tip -->
  <rect x="60" y="330" width="680" height="60" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1" rx="6"/>
  <text x="80" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c4a6e">Success Strategy:</text>
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="12" fill="#374151">Focus on applying SAFe principles to complex organizational scenarios.</text>
  <text x="80" y="385" font-family="Arial, sans-serif" font-size="12" fill="#374151">Practice scenario-based thinking rather than framework memorization.</text>
  
  <!-- Agile36 branding -->
  <text x="720" y="485" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">agile36.com</text>