<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="max-width: 800px; width: 100%; height: auto;">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    SAFe Framework: Four Levels Structure
  </text>
  
  <!-- Portfolio Level -->
  <rect x="50" y="80" width="700" height="100" fill="#3498db" rx="10" opacity="0.9"/>
  <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    PORTFOLIO LEVEL
  </text>
  <text x="400" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Strategic Alignment • Investment Decisions • Lean Portfolio Management
  </text>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Epic Owners • Enterprise Architects • Business Owners
  </text>
  
  <!-- Large Solution Level -->
  <rect x="75" y="200" width="650" height="90" fill="#27ae60" rx="8" opacity="0.9"/>
  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    LARGE SOLUTION LEVEL
  </text>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Multiple ART Coordination • Solution Management • Customer Integration
  </text>
  <text x="400" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Solution Train Engineer • Solution Architect • Solution Management
  </text>
  
  <!-- Program Level -->
  <rect x="100" y="310" width="600" height="90" fill="#e67e22" rx="8" opacity="0.9"/>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    PROGRAM LEVEL (ART)
  </text>
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Agile Release Train • PI Planning • Solution Delivery
  </text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Release Train Engineer • Product Manager • System Architect
  </text>
  
  <!-- Team Level -->
  <rect x="125" y="420" width="550" height="90" fill="#9b59b6" rx="8" opacity="0.9"/>
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    TEAM LEVEL
  </text>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Agile Teams • Sprint Execution • Feature Delivery
  </text>
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Product Owner • Scrum Master • Development Team
  </text>
  
  <!-- Flow arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Strategy down arrows -->
  <line x1="200" y1="180" x2="200" y2="195" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="290" x2="400" y2="305" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="400" x2="600" y2="415" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Value up arrows -->
  <line x1="250" y1="415" x2="250" y2="400" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="305" x2="450" y2="290" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="195" x2="650" y2="180" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Labels for arrows -->
  <text x="160" y="190" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Strategy</text>
  <text x="560" y="410" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Alignment</text>
  <text x="270" y="410" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Value</text>
  <text x="670" y="190" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Delivery</text>
  
  <!-- Bottom note -->
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
    Each level maintains Agile principles while adding coordination and alignment capabilities
  </text>