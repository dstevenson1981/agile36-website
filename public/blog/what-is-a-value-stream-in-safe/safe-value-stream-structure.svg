<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SAFe Value Stream Structure</text>
  
  <!-- Operational Value Stream -->
  <rect x="50" y="60" width="700" height="100" rx="10" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3b82f6">Operational Value Stream</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Customer Request → Order Processing → Fulfillment → Service Delivery</text>
  
  <!-- Flow arrows in operational value stream -->
  <path d="M 150 120 L 200 120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 120 L 350 120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 450 120 L 500 120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 600 120 L 650 120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Development Value Streams -->
  <text x="70" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Development Value Streams (Technology Solutions)</text>
  
  <!-- Dev Value Stream 1 -->
  <rect x="50" y="230" width="200" height="180" rx="8" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981">Customer Portal</text>
  <rect x="60" y="270" width="180" height="60" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="70" y="290" font-family="Arial, sans-serif" font-size="12" fill="#374151">ART 1: Frontend</text>
  <text x="70" y="305" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• UI/UX Team</text>
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Mobile Team</text>
  
  <rect x="60" y="340" width="180" height="60" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="70" y="360" font-family="Arial, sans-serif" font-size="12" fill="#374151">ART 2: API Services</text>
  <text x="70" y="375" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Backend Team</text>
  <text x="70" y="390" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Integration Team</text>
  
  <!-- Dev Value Stream 2 -->
  <rect x="300" y="230" width="200" height="180" rx="8" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="2"/>
  <text x="310" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8b5cf6">Order Management</text>
  <rect x="310" y="270" width="180" height="60" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="320" y="290" font-family="Arial, sans-serif" font-size="12" fill="#374151">ART 3: Order Processing</text>
  <text x="320" y="305" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Order Team</text>
  <text x="320" y="320" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Workflow Team</text>
  
  <rect x="310" y="340" width="180" height="60" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="320" y="360" font-family="Arial, sans-serif" font-size="12" fill="#374151">ART 4: Inventory</text>
  <text x="320" y="375" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Inventory Team</text>
  <text x="320" y="390" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Analytics Team</text>
  
  <!-- Dev Value Stream 3 -->
  <rect x="550" y="230" width="200" height="180" rx="8" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">Fulfillment Platform</text>
  <rect x="560" y="270" width="180" height="130" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="570" y="290" font-family="Arial, sans-serif" font-size="12" fill="#374151">ART 5: Logistics</text>
  <text x="570" y="305" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Shipping Team</text>
  <text x="570" y="320" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Tracking Team</text>
  <text x="570" y="335" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Partner Integration</text>
  <text x="570" y="355" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Delivery Optimization</text>
  <text x="570" y="375" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Customer Communication</text>
  
  <!-- Supporting arrows -->
  <path d="M 150 180 L 150 230" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <path d="M 400 180 L 400 230" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <path d="M 650 180 L 650 230" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Support label -->
  <text x="120" y="200" font-family="Arial, sans-serif" font-size="12" fill="#64748b">supports</text>
  <text x="370" y="200" font-family="Arial, sans-serif" font-size="12" fill="#64748b">supports</text>
  <text x="620" y="200" font-family="Arial, sans-serif" font-size="12" fill="#64748b">supports</text>
  
  <!-- Bottom note -->
  <text x="50" y="450" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Multiple Development Value Streams provide technology solutions that enable</text>
  <text x="50" y="470" font-family="Arial, sans-serif" font-size="12" fill="#64748b">the Operational Value Stream to deliver continuous value to customers.</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>