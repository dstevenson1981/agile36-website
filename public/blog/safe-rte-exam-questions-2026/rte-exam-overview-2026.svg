<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#1e40af"/>
  <text x="400" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">SAFe RTE Exam 2026 Overview</text>
  
  <!-- Main Stats Container -->
  <rect x="50" y="120" width="700" height="320" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  
  <!-- Key Stats Grid -->
  <!-- Duration -->
  <rect x="80" y="150" width="150" height="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="155" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">DURATION</text>
  <text x="155" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1e40af">120</text>
  <text x="155" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">minutes</text>
  
  <!-- Questions -->
  <rect x="250" y="150" width="150" height="120" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="8"/>
  <text x="325" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">QUESTIONS</text>
  <text x="325" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#166534">60</text>
  <text x="325" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">total</text>
  
  <!-- Pass Rate -->
  <rect x="420" y="150" width="150" height="120" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="495" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">PASS RATE</text>
  <text x="495" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#92400e">73%</text>
  <text x="495" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">required</text>
  
  <!-- Cost -->
  <rect x="590" y="150" width="150" height="120" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="665" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">EXAM COST</text>
  <text x="665" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#991b1b">$595</text>
  <text x="665" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">USD</text>
  
  <!-- Key Focus Areas -->
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">2026 Key Focus Areas:</text>
  <text x="90" y="335" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">• PI Planning Facilitation (25-30%)</text>
  <text x="90" y="355" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">• ART Performance & Metrics (20-25%)</text>
  <text x="90" y="375" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">• Problem-Solving & Impediments (15-20%)</text>
  <text x="90" y="395" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">• Continuous Delivery Pipeline (10-15%)</text>
  <text x="90" y="415" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">• Cross-ART Coordination (12-15%)</text>
  
  <!-- Footer -->
  <rect x="0" y="460" width="800" height="40" fill="#f1f5f9"/>
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Scenario-based questions: 70% | Knowledge-based questions: 30%</text>