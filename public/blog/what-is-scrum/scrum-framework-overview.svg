<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="font-bold text-2xl" fill="#1e293b">Scrum Framework Overview</text>
  
  <!-- Sprint Container -->
  <rect x="50" y="80" width="700" height="180" rx="10" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="60" y="105" class="font-semibold text-lg" fill="#3b82f6">Sprint (1-4 weeks)</text>
  
  <!-- Sprint Events -->
  <rect x="80" y="120" width="120" height="60" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="140" y="140" text-anchor="middle" class="font-medium text-sm" fill="#1e40af">Sprint</text>
  <text x="140" y="155" text-anchor="middle" class="font-medium text-sm" fill="#1e40af">Planning</text>
  <text x="140" y="170" text-anchor="middle" class="text-xs" fill="#64748b">Start of Sprint</text>
  
  <rect x="220" y="120" width="120" height="60" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="280" y="140" text-anchor="middle" class="font-medium text-sm" fill="#92400e">Daily</text>
  <text x="280" y="155" text-anchor="middle" class="font-medium text-sm" fill="#92400e">Scrum</text>
  <text x="280" y="170" text-anchor="middle" class="text-xs" fill="#64748b">15 min daily</text>
  
  <rect x="360" y="120" width="120" height="60" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="420" y="140" text-anchor="middle" class="font-medium text-sm" fill="#166534">Sprint</text>
  <text x="420" y="155" text-anchor="middle" class="font-medium text-sm" fill="#166534">Review</text>
  <text x="420" y="170" text-anchor="middle" class="text-xs" fill="#64748b">End of Sprint</text>
  
  <rect x="500" y="120" width="120" height="60" rx="5" fill="#fde2e8" stroke="#ec4899"/>
  <text x="560" y="140" text-anchor="middle" class="font-medium text-sm" fill="#be185d">Sprint</text>
  <text x="560" y="155" text-anchor="middle" class="font-medium text-sm" fill="#be185d">Retrospective</text>
  <text x="560" y="170" text-anchor="middle" class="text-xs" fill="#64748b">Process Improvement</text>
  
  <!-- Roles Section -->
  <text x="50" y="310" class="font-bold text-xl" fill="#1e293b">Scrum Roles</text>
  
  <circle cx="150" cy="370" r="50" fill="#3b82f6"/>
  <text x="150" y="365" text-anchor="middle" class="font-medium text-sm" fill="white">Product</text>
  <text x="150" y="380" text-anchor="middle" class="font-medium text-sm" fill="white">Owner</text>
  <text x="150" y="430" text-anchor="middle" class="text-sm" fill="#64748b">Manages backlog</text>
  <text x="150" y="445" text-anchor="middle" class="text-sm" fill="#64748b">& stakeholders</text>
  
  <circle cx="400" cy="370" r="50" fill="#22c55e"/>
  <text x="400" y="365" text-anchor="middle" class="font-medium text-sm" fill="white">Scrum</text>
  <text x="400" y="380" text-anchor="middle" class="font-medium text-sm" fill="white">Master</text>
  <text x="400" y="430" text-anchor="middle" class="text-sm" fill="#64748b">Facilitates process</text>
  <text x="400" y="445" text-anchor="middle" class="text-sm" fill="#64748b">& removes impediments</text>
  
  <circle cx="650" cy="370" r="50" fill="#f59e0b"/>
  <text x="650" y="365" text-anchor="middle" class="font-medium text-sm" fill="white">Development</text>
  <text x="650" y="380" text-anchor="middle" class="font-medium text-sm" fill="white">Team</text>
  <text x="650" y="430" text-anchor="middle" class="text-sm" fill="#64748b">Builds product</text>
  <text x="650" y="445" text-anchor="middle" class="text-sm" fill="#64748b">increment</text>
  
  <!-- Artifacts Section -->
  <text x="50" y="520" class="font-bold text-xl" fill="#1e293b">Key Artifacts</text>
  
  <rect x="50" y="540" width="180" height="40" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="140" y="565" text-anchor="middle" class="font-medium" fill="#1e293b">Product Backlog</text>
  
  <rect x="250" y="540" width="180" height="40" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="340" y="565" text-anchor="middle" class="font-medium" fill="#1e293b">Sprint Backlog</text>
  
  <rect x="450" y="540" width="180" height="40" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="540" y="565" text-anchor="middle" class="font-medium" fill="#1e293b">Product Increment</text>
  
  <!-- Flow arrows -->
  <path d="M 200 150 L 220 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 340 150 L 360 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 480 150 L 500 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>