<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Vector Database Architecture</text>
  
  <!-- Traditional Database Section -->
  <rect x="50" y="60" width="300" height="180" fill="#e2e8f0" stroke="#64748b" stroke-width="2" rx="8"/>
  <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#334155">Traditional Database</text>
  
  <!-- Traditional data rows -->
  <rect x="70" y="100" width="260" height="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="118" font-family="Arial, sans-serif" font-size="12" fill="#475569">ID: 1 | Name: "Car" | Type: "Vehicle"</text>
  
  <rect x="70" y="130" width="260" height="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="148" font-family="Arial, sans-serif" font-size="12" fill="#475569">ID: 2 | Name: "Bicycle" | Type: "Vehicle"</text>
  
  <rect x="70" y="160" width="260" height="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="178" font-family="Arial, sans-serif" font-size="12" fill="#475569">ID: 3 | Name: "Truck" | Type: "Vehicle"</text>
  
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Exact Match Queries</text>
  <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">SELECT * WHERE name = "Car"</text>
  
  <!-- Vector Database Section -->
  <rect x="450" y="60" width="300" height="180" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="600" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Vector Database</text>
  
  <!-- Vector representations -->
  <rect x="470" y="100" width="260" height="25" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
  <text x="480" y="118" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">[0.8, 0.2, 0.9, 0.1] "Car"</text>
  
  <rect x="470" y="130" width="260" height="25" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
  <text x="480" y="148" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">[0.7, 0.9, 0.1, 0.3] "Bicycle"</text>
  
  <rect x="470" y="160" width="260" height="25" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
  <text x="480" y="178" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">[0.9, 0.1, 0.8, 0.2] "Truck"</text>
  
  <text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">Similarity Search</text>
  <text x="600" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">Find vectors similar to [0.8, 0.3, 0.9, 0.1]</text>
  
  <!-- Process Flow -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Vector Database Process</text>
  
  <!-- Step 1: Data Input -->
  <rect x="50" y="300" width="120" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="110" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Raw Data</text>
  <text x="110" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">Text, Images,</text>
  <text x="110" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">Audio, etc.</text>
  
  <!-- Arrow 1 -->
  <path d="M 170 330 L 220 330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Embedding Model -->
  <rect x="230" y="300" width="120" height="60" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2" rx="8"/>
  <text x="290" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">ML Model</text>
  <text x="290" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b21a8">Creates</text>
  <text x="290" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b21a8">Embeddings</text>
  
  <!-- Arrow 2 -->
  <path d="M 350 330 L 400 330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Vector Storage -->
  <rect x="410" y="300" width="120" height="60" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="8"/>
  <text x="470" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Vector Storage</text>
  <text x="470" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">High-dimensional</text>
  <text x="470" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">Indexing</text>
  
  <!-- Arrow 3 -->
  <path d="M 530 330 L 580 330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Similarity Search -->
  <rect x="590" y="300" width="120" height="60" fill="#fed7d7" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="650" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">Fast Search</text>
  <text x="650" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Semantic</text>
  <text x="650" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Matching</text>
  
  <!-- Use Cases -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Common Use Cases</text>
  
  <rect x="80" y="420" width="140" height="50" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
  <text x="150" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Semantic Search</text>
  <text x="150" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Context-aware queries</text>
  
  <rect x="240" y="420" width="140" height="50" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
  <text x="310" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Recommendations</text>
  <text x="310" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">"Similar items"</text>
  
  <rect x="400" y="420" width="140" height="50" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
  <text x="470" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">RAG Systems</text>
  <text x="470" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Context retrieval</text>
  
  <rect x="560" y="420" width="140" height="50" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
  <text x="630" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Image Search</text>
  <text x="630" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Visual similarity</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>