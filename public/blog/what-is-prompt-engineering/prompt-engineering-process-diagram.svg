<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Prompt Engineering Process
  </text>
  
  <!-- Process Steps -->
  <!-- Step 1: Define Context -->
  <rect x="50" y="80" width="140" height="80" rx="8" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    1. Define Context
  </text>
  <text x="120" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Role, Industry,
  </text>
  <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Objectives
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 200 120 L 240 120" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Structure Request -->
  <rect x="250" y="80" width="140" height="80" rx="8" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    2. Structure Request
  </text>
  <text x="320" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Format, Length,
  </text>
  <text x="320" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Constraints
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 400 120 L 440 120" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Add Examples -->
  <rect x="450" y="80" width="140" height="80" rx="8" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    3. Add Examples
  </text>
  <text x="520" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Sample Inputs,
  </text>
  <text x="520" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Expected Outputs
  </text>
  
  <!-- Arrow 3 -->
  <path d="M 600 120 L 640 120" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Test & Iterate -->
  <rect x="650" y="80" width="140" height="80" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="2"/>
  <text x="720" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    4. Test & Iterate
  </text>
  <text x="720" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Refine Based
  </text>
  <text x="720" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    on Results
  </text>
  
  <!-- Example Boxes -->
  <!-- Poor Example -->
  <rect x="50" y="220" width="350" height="120" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="70" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">
    ❌ Poor Prompt Example
  </text>
  <text x="70" y="270" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">
    "Write user stories for a mobile app"
  </text>
  <text x="70" y="295" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Problems:
  </text>
  <text x="70" y="310" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    • No context about role or industry
  </text>
  <text x="70" y="325" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    • Undefined app type and features
  </text>
  
  <!-- Good Example -->
  <rect x="420" y="220" width="350" height="120" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">
    ✅ Engineered Prompt Example
  </text>
  <text x="440" y="270" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">
    "As a SAFe Product Owner, write 5 user stories for a mobile
  </text>
  <text x="440" y="285" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">
    banking app. Include Given-When-Then acceptance criteria."
  </text>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Includes: Role, quantity, domain, format requirements
  </text>
  
  <!-- Key Techniques Section -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Key Techniques
  </text>
  
  <!-- Technique Boxes -->
  <rect x="80" y="410" width="130" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="145" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">
    Chain-of-Thought
  </text>
  <text x="145" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    Show reasoning steps
  </text>
  <text x="145" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    for complex problems
  </text>
  
  <rect x="230" y="410" width="130" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="295" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">
    Few-Shot Learning
  </text>
  <text x="295" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    Provide examples of
  </text>
  <text x="295" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    desired outputs
  </text>
  
  <rect x="380" y="410" width="130" height="60" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
  <text x="445" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">
    Role-Based
  </text>
  <text x="445" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    "Act as an expert
  </text>
  <text x="445" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    Scrum Master..."
  </text>
  
  <rect x="530" y="410" width="130" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="595" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">
    Template-Based
  </text>
  <text x="595" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    Structured formats
  </text>
  <text x="595" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    for consistency
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>