<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Large Language Model Architecture
  </text>
  
  <!-- Input Layer -->
  <rect x="50" y="100" width="120" height="60" rx="8" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    Input Text
  </text>
  <text x="110" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    "What is AI?"
  </text>
  
  <!-- Tokenization -->
  <rect x="220" y="100" width="120" height="60" rx="8" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="2"/>
  <text x="280" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    Tokenization
  </text>
  <text x="280" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    ["What", "is", "AI", "?"]
  </text>
  
  <!-- Embedding Layer -->
  <rect x="390" y="100" width="120" height="60" rx="8" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    Embedding
  </text>
  <text x="450" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Vector Representation
  </text>
  
  <!-- Transformer Layers -->
  <rect x="200" y="220" width="400" height="200" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">
    Transformer Architecture
  </text>
  
  <!-- Multi-Head Attention -->
  <rect x="220" y="270" width="160" height="40" rx="6" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1"/>
  <text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">
    Multi-Head Attention
  </text>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    Context Understanding
  </text>
  
  <!-- Feed Forward -->
  <rect x="420" y="270" width="160" height="40" rx="6" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">
    Feed Forward Network
  </text>
  <text x="500" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">
    Pattern Processing
  </text>
  
  <!-- Layer Stack -->
  <rect x="220" y="330" width="360" height="30" rx="4" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="1"/>
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">
    Multiple Layers (12-96+ layers depending on model size)
  </text>
  
  <!-- Parameters -->
  <rect x="220" y="370" width="360" height="30" rx="4" fill="#ec4899" opacity="0.1" stroke="#ec4899" stroke-width="1"/>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">
    Billions of Parameters (175B for GPT-3, 1T+ for GPT-4)
  </text>
  
  <!-- Output Layer -->
  <rect x="560" y="100" width="120" height="60" rx="8" fill="#06b6d4" opacity="0.1" stroke="#06b6d4" stroke-width="2"/>
  <text x="620" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    Generated Text
  </text>
  <text x="620" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Response
  </text>
  
  <!-- Arrows -->
  <!-- Input to Tokenization -->
  <path d="M 170 130 L 210 130" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Tokenization to Embedding -->
  <path d="M 340 130 L 380 130" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Embedding to Transformer -->
  <path d="M 450 160 L 450 210" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Transformer to Output -->
  <path d="M 450 220 Q 450 190 500 190 Q 550 190 550 130 L 550 130" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Training Data Annotation -->
  <rect x="50" y="480" width="200" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="150" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    Training Data
  </text>
  <text x="150" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    • Books, articles, web pages
  </text>
  <text x="150" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    • Hundreds of billions of words
  </text>
  <text x="150" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    • Multiple languages
  </text>
  
  <!-- Model Capabilities -->
  <rect x="550" y="480" width="200" height="80" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="650" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    Capabilities
  </text>
  <text x="650" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    • Text generation
  </text>
  <text x="650" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    • Question answering
  </text>
  <text x="650" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    • Code writing, translation
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>