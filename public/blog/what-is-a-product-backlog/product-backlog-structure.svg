<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="text-2xl font-bold" fill="#1e293b">Product Backlog Structure</text>
  
  <!-- High Priority Section -->
  <rect x="50" y="80" width="700" height="120" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="400" y="105" text-anchor="middle" class="text-lg font-semibold" fill="white">High Priority (Ready for Development)</text>
  
  <!-- High priority items -->
  <rect x="70" y="120" width="200" height="30" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
  <text x="80" y="140" class="text-sm font-medium" fill="#1e40af">User Story: Login Feature</text>
  
  <rect x="290" y="120" width="200" height="30" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
  <text x="300" y="140" class="text-sm font-medium" fill="#1e40af">Bug Fix: Payment Error</text>
  
  <rect x="510" y="120" width="200" height="30" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
  <text x="520" y="140" class="text-sm font-medium" fill="#1e40af">Enhancement: Search</text>
  
  <rect x="70" y="160" width="200" height="30" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
  <text x="80" y="180" class="text-sm font-medium" fill="#1e40af">Technical Debt: API Update</text>
  
  <rect x="290" y="160" width="200" height="30" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
  <text x="300" y="180" class="text-sm font-medium" fill="#1e40af">User Story: Profile Page</text>
  
  <!-- Medium Priority Section -->
  <rect x="50" y="220" width="700" height="100" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="400" y="245" text-anchor="middle" class="text-lg font-semibold" fill="white">Medium Priority (Being Refined)</text>
  
  <!-- Medium priority items -->
  <rect x="70" y="270" width="200" height="30" fill="#fef3c7" stroke="#f59e0b" rx="4"/>
  <text x="80" y="290" class="text-sm font-medium" fill="#92400e">Epic: Mobile App</text>
  
  <rect x="290" y="270" width="200" height="30" fill="#fef3c7" stroke="#f59e0b" rx="4"/>
  <text x="300" y="290" class="text-sm font-medium" fill="#92400e">Research: Analytics Tool</text>
  
  <rect x="510" y="270" width="200" height="30" fill="#fef3c7" stroke="#f59e0b" rx="4"/>
  <text x="520" y="290" class="text-sm font-medium" fill="#92400e">User Story: Notifications</text>
  
  <!-- Low Priority Section -->
  <rect x="50" y="340" width="700" height="100" fill="#6b7280" stroke="#4b5563" stroke-width="2" rx="8"/>
  <text x="400" y="365" text-anchor="middle" class="text-lg font-semibold" fill="white">Low Priority (Future Consideration)</text>
  
  <!-- Low priority items -->
  <rect x="70" y="390" width="200" height="30" fill="#e5e7eb" stroke="#6b7280" rx="4"/>
  <text x="80" y="410" class="text-sm font-medium" fill="#374151">Idea: Social Features</text>
  
  <rect x="290" y="390" width="200" height="30" fill="#e5e7eb" stroke="#6b7280" rx="4"/>
  <text x="300" y="410" class="text-sm font-medium" fill="#374151">Enhancement: Themes</text>
  
  <rect x="510" y="390" width="200" height="30" fill="#e5e7eb" stroke="#6b7280" rx="4"/>
  <text x="520" y="410" class="text-sm font-medium" fill="#374151">Integration: CRM</text>
  
  <!-- Arrows showing flow -->
  <path d="M400 200 L400 220" stroke="#1e293b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M400 320 L400 340" stroke="#1e293b" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e293b"/>
    </marker>
  </defs>
  
  <!-- Side labels -->
  <text x="30" y="140" class="text-sm font-medium" fill="#1e293b" transform="rotate(-90 30 140)">Detailed & Ready</text>
  <text x="30" y="270" class="text-sm font-medium" fill="#1e293b" transform="rotate(-90 30 270)">Rough Estimates</text>
  <text x="30" y="390" class="text-sm font-medium" fill="#1e293b" transform="rotate(-90 30 390)">Ideas & Concepts</text>
  
  <!-- Key information -->
  <rect x="50" y="480" width="700" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="70" y="505" class="text-lg font-semibold" fill="#1e293b">Key Principles</text>
  <text x="70" y="525" class="text-sm" fill="#475569">• Items prioritized by business value and customer impact</text>
  <text x="70" y="545" class="text-sm" fill="#475569">• Top items are refined and ready for sprint planning</text>
  <text x="410" y="525" class="text-sm" fill="#475569">• Product Owner owns and maintains the backlog</text>
  <text x="410" y="545" class="text-sm" fill="#475569">• Continuous refinement ensures quality and clarity</text>